[project]
name = "snap2latex"
version = "0.1.0"
description = "macOS menu-bar app that converts a screenshot of a math equation into LaTeX (nougat-latex-ocr)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "chardet>=7.4.3",
    "pillow>=12.2.0",
    "rumps>=0.4.0",
    "pyobjc-framework-cocoa>=12.2",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "transformers>=5.10.2",
]

# 构建工具不是运行时依赖，单独放 dev 组；`uv sync` 默认会一并安装。
[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
]
